        log('  match /databases/{database}/documents {');
        log('    allow read, write: if true;');
        log('  }');
        log('}');
        showStatus('error', 'Connection test failed. See the log below for details.');
        btn.disabled = false;
        return;
      }

      // Test 2: Try to WRITE

      try {
        await Promise.race([
          db.collection('readings').doc('test-doc').set({
            test: true,
            timestamp: firebase.firestore.Timestamp.now()
          }),
          new Promise(function(_, reject) { setTimeout(function() { reject(new Error('Timeout after 10 seconds')); }, 10000); })
        ]);

        // Clean up
        await db.collection('readings').doc('test-doc').delete();
        log('Cleanup: Test document deleted.');

    async function startImport() {
      var btn = document.getElementById('import-btn');
      btn.disabled = true;
      showStatus('working', 'Importing... please wait.');
      log('\n--- Starting import of ' + readings.length + ' readings ---');

      var success = 0;
      var errors = 0;

      for (var i = 0; i < readings.length; i++) {
        var r = readings[i];
        try {
          var data = {
            systolic: r.systolic,
            diastolic: r.diastolic,
            sugar: r.sugar,
            meal_timing: r.meal_timing,
            notes: r.notes,
            recorded_at: firebase.firestore.Timestamp.fromDate(new Date(r.recorded_at)),
            created_at: firebase.firestore.Timestamp.fromDate(new Date(r.created_at))
          };
          await Promise.race([
            db.collection('readings').doc(r.id).set(data),
            new Promise(function(_, reject) { setTimeout(function() { reject(new Error('Timeout after 15 seconds')); }, 15000); })
          ]);
          success++;
          document.getElementById('progress').innerHTML = 'Imported ' + (i + 1) + ' of ' + readings.length + ' (' + success + ' success, ' + errors + ' errors)';
          log('OK: ' + (i+1) + '/' + readings.length + ' - ' + r.recorded_at.substring(0,10));
        } catch (err) {
          errors++;
          log('ERROR on reading ' + (i + 1) + ': ' + err.message);
          document.getElementById('progress').innerHTML = 'Imported ' + (i + 1) + ' of ' + readings.length + ' (' + success + ' success, ' + errors + ' errors)';
        }
      }

      if (errors === 0) {
        showStatus('done', 'Done! ' + success + ' readings imported successfully.\nYou can now close this page and delete this file.');
      } else {
        showStatus('error', 'Imported ' + success + ' readings with ' + errors + ' errors. Check the log below.');
      }
      btn.disabled = false;
    }
