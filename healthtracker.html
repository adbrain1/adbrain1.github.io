  <style>
    :root {
      color-scheme: light dark;
      --bg: oklch(0.99 0.004 15);
      --fg: oklch(0.18 0.02 15);
      --card: #fff;
      --muted: oklch(0.965 0.008 15);
      --muted-fg: oklch(0.5 0.02 15);
      --border: oklch(0.92 0.008 15);
      --primary: oklch(0.55 0.2 18);
      --primary-fg: oklch(0.99 0.005 15);
      --accent: oklch(0.95 0.03 15);
      --ring: oklch(0.55 0.2 18);
      --danger: oklch(0.577 0.245 27.325);
      --danger-fg: #fff;
      --radius: 0.75rem;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: oklch(0.16 0.01 15);
        --fg: oklch(0.97 0.005 15);
        --card: oklch(0.21 0.015 15);
        --muted: oklch(0.26 0.01 15);
        --muted-fg: oklch(0.72 0.015 15);
        --border: oklch(1 0 0 / 12%);
        --accent: oklch(0.3 0.03 15);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--fg); line-height: 1.5;
      -webkit-font-smoothing: antialiased; min-height: 100vh;
      display: flex; flex-direction: column;
    }

    .wrap { width: 100%; max-width: 48rem; margin: 0 auto; padding: 0 1rem; }
    header.app-header {
      position: sticky; top: 0; z-index: 30;
      background: color-mix(in oklch, var(--bg) 88%, transparent);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
    }
    .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 0.7rem 1rem; max-width: 48rem; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 0.6rem; }
    .brand-icon { width: 2.25rem; height: 2.25rem; border-radius: 0.75rem; background: var(--primary); color: var(--primary-fg); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
    .brand-icon svg { width: 1.25rem; height: 1.25rem; }
    .brand-title { font-size: 0.72rem; font-weight: 500; color: var(--muted-fg); letter-spacing: 0.01em; line-height: 1.1; }
    .brand-title-2 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
    .status-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; display: inline-block; }
    .status-dot.connected { background: #10b981; }
    .status-dot.connecting { background: #f59e0b; animation: pulse 1.2s infinite; }
    .status-dot.error { background: var(--danger); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .status-text { font-size: 0.65rem; color: var(--muted-fg); display: flex; align-items: center; gap: 0.3rem; }

    main { flex: 1; padding: 1.25rem 0 1.5rem; }
    footer.app-footer { margin-top: auto; border-top: 1px solid var(--border); background: color-mix(in oklch, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
    .footer-inner { padding: 0.9rem 1rem; max-width: 48rem; margin: 0 auto; text-align: center; }
    .footer-inner p { margin: 0; font-size: 0.7rem; color: var(--muted-fg); }

    .list-head { display: flex; align-items: center; justify-content: space-between; padding: 0 0.25rem; margin-bottom: 0.75rem; }
    .list-head .section-title { margin: 0; }
    .list-count { font-size: 0.75rem; color: var(--muted-fg); display: flex; align-items: center; gap: 0.4rem; }

    .readings-scroll { max-height: 70vh; overflow-y: auto; padding-right: 0.15rem; }
    .readings-scroll::-webkit-scrollbar { width: 6px; }
    .readings-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9999px; }
    .reading-card { border: 1px solid var(--border); border-radius: 0.75rem; padding: 0.9rem; background: var(--card); box-shadow: var(--shadow); margin-bottom: 0.6rem; transition: border-color .2s, box-shadow .2s; }
    .reading-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
    .reading-val { font-size: 1.5rem; font-weight: 700; line-height: 1; }
    .reading-val .sep { color: var(--muted-fg); margin: 0 0.1rem; }
    .reading-unit { font-size: 0.75rem; color: var(--muted-fg); margin-left: 0.25rem; }
    .reading-badges { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
    .reading-time { display: flex; align-items: center; gap: 0.3rem; font-size: 0.72rem; color: var(--muted-fg); margin-top: 0.5rem; }
    .reading-time svg { width: 0.75rem; height: 0.75rem; }

    .badge { display: inline-flex; align-items: center; gap: 0.25rem; border-radius: 0.375rem; padding: 0.15rem 0.5rem; font-size: 0.7rem; font-weight: 500; border: 1px solid transparent; }
    .badge svg { width: 0.75rem; height: 0.75rem; }
    .badge.meal { background: var(--muted); color: var(--fg); }

    .table-wrap { display: none; border: 1px solid var(--border); border-radius: 1rem; overflow: hidden; background: var(--card); box-shadow: var(--shadow); }
    @media (min-width: 640px) { .table-wrap { display: block; } .mobile-list { display: none; } }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    thead tr { background: var(--muted); border-bottom: 1px solid var(--border); }
    th { text-align: left; padding: 0.75rem 1rem; font-weight: 600; font-size: 0.8rem; }
    td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--muted); }
    td .t-when-date { font-weight: 600; }
    td .t-when-time { display: flex; align-items: center; gap: 0.25rem; font-size: 0.72rem; color: var(--muted-fg); }
    td .t-when-time svg { width: 0.7rem; height: 0.7rem; }
    td .t-reading { font-size: 1.15rem; font-weight: 700; }
    td .t-reading .sep { color: var(--muted-fg); }
    td .t-reading .unit { font-size: 0.7rem; color: var(--muted-fg); margin-left: 0.2rem; font-weight: 400; }

    .empty { border: 1px dashed var(--border); border-radius: 1rem; background: var(--card); padding: 2rem 1rem; text-align: center; }
    .empty-icon { width: 3rem; height: 3rem; border-radius: 50%; background: var(--muted); display: flex; align-items: center; justify-content: center; margin: 0 auto 0.75rem; color: var(--muted-fg); }
    .empty-icon svg { width: 1.5rem; height: 1.5rem; }
    .empty-title { font-size: 0.9rem; font-weight: 600; margin: 0 0 0.25rem; }
    .empty-text { font-size: 0.78rem; color: var(--muted-fg); max-width: 18rem; margin: 0 auto; }

    .skeleton { height: 5rem; border-radius: 0.75rem; background: var(--muted); margin-bottom: 0.6rem; animation: skpulse 1.5s ease-in-out infinite; }
    @keyframes skpulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; height: 2.25rem; padding: 0 0.75rem; border: none; border-radius: 0.5rem; font-size: 0.85rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: background .15s, opacity .15s, transform .05s; text-decoration: none; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--fg); }
    .btn-outline:hover:not(:disabled) { background: var(--accent); }

    .toast-wrap { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 0.5rem; align-items: center; pointer-events: none; width: 100%; max-width: 24rem; padding: 0 1rem; }
    .toast { background: var(--card); border: 1px solid var(--border); border-radius: 0.6rem; padding: 0.75rem 1rem; box-shadow: 0 8px 30px rgba(0,0,0,0.15); display: flex; gap: 0.6rem; align-items: flex-start; pointer-events: auto; animation: toastIn .2s ease; width: 100%; }
    @keyframes toastIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .toast.error { border-color: color-mix(in oklch, var(--danger) 45%, transparent); }
    .toast-icon { width: 1.25rem; height: 1.25rem; flex-shrink: 0; margin-top: 0.05rem; }
    .toast-icon.success { color: #10b981; }
    .toast-icon.error { color: var(--danger); }
    .toast-body { min-width: 0; }
    .toast-title { font-size: 0.85rem; font-weight: 600; line-height: 1.2; }
    .toast-desc { font-size: 0.78rem; color: var(--muted-fg); margin-top: 0.1rem; }

    .top-actions { display: flex; gap: 0.4rem; align-items: center; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* View toggle */
    .view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 0.5rem; overflow: hidden; height: 2.25rem; }
    .view-toggle button { background: transparent; border: none; padding: 0 0.75rem; font-size: 0.8rem; font-weight: 600; color: var(--muted-fg); cursor: pointer; font-family: inherit; transition: background .15s, color .15s; height: 100%; display: inline-flex; align-items: center; gap: 0.3rem; }
    .view-toggle button.active { background: var(--primary); color: var(--primary-fg); }
    .view-toggle button:not(.active):hover { background: var(--accent); color: var(--fg); }

    /* Daily view */
    .daily-card { border: 1px solid var(--border); border-radius: 0.75rem; background: var(--card); box-shadow: var(--shadow); margin-bottom: 0.6rem; overflow: hidden; }
    .daily-card-date { padding: 0.5rem 0.9rem; background: var(--muted); font-weight: 700; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
    .daily-slot { padding: 0.5rem 0.9rem; border-bottom: 1px solid var(--border); }
    .daily-slot:last-child { border-bottom: none; }
    .daily-slot-label { font-size: 0.65rem; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.2rem; }
    .daily-slot-empty { font-size: 0.75rem; color: var(--muted-fg); font-style: italic; }
    .daily-reading { font-size: 0.8rem; margin-bottom: 0.35rem; padding-bottom: 0.2rem; border-bottom: 1px dotted var(--border); }
    .daily-reading:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .daily-reading .dr-row1 { font-size: 0.65rem; color: var(--muted-fg); margin-bottom: 0.1rem; }
    .daily-reading .dr-row2 { font-weight: 700; font-size: 0.85rem; min-height: 1rem; }
    .daily-reading .dr-row3 { color: var(--fg); font-size: 0.75rem; min-height: 0.9rem; font-weight: 700; }
    .daily-reading .dr-row4 { font-weight: 700; font-size: 0.7rem; color: var(--fg); margin-top: 0.1rem; }
    .daily-reading .dr-meal { display: inline-block; font-size: 0.55rem; background: var(--muted); color: var(--muted-fg); padding: 0.05rem 0.3rem; border-radius: 0.2rem; margin-left: 0.3rem; vertical-align: middle; }
    .daily-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; }
    .daily-table th { background: var(--muted); padding: 0.5rem 0.4rem; font-weight: 600; font-size: 0.7rem; text-align: left; border: 1px solid var(--border); }
    .daily-table td { padding: 0.4rem; border: 1px solid var(--border); vertical-align: top; }
    .daily-table .dr-row1 { font-size: 0.6rem; color: var(--muted-fg); margin-bottom: 0.05rem; }
    .daily-table .dr-row2 { font-weight: 700; font-size: 0.75rem; min-height: 0.9rem; }
    .daily-table .dr-row3 { color: var(--fg); font-size: 0.65rem; min-height: 0.8rem; font-weight: 700; }
    .daily-table .dr-row4 { font-weight: 700; font-size: 0.6rem; color: var(--fg); margin-top: 0.05rem; }
    .daily-table .dr-meal { display: inline-block; font-size: 0.5rem; background: var(--muted); color: var(--muted-fg); padding: 0.05rem 0.25rem; border-radius: 0.2rem; }
    .daily-footnote { font-size: 0.65rem; color: var(--muted-fg); margin-top: 0.5rem; padding: 0.4rem 0.6rem; background: var(--muted); border-radius: 0.4rem; line-height: 1.4; }

    .live-indicator { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.65rem; color: #10b981; font-weight: 500; }
    .live-dot { width: 0.4rem; height: 0.4rem; border-radius: 50%; background: #10b981; animation: livepulse 2s infinite; }
    @keyframes livepulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
  </style>

    function sbHeaders(extra) {
      return Object.assign({

    function fetchReadings() {
      if (!configured) {
        setStatus("error", "Not configured");
        renderErrorConfig();

      fetch(SUPABASE_URL + "/rest/v1/readings?order=recorded_at.desc&select=id,systolic,diastolic,sugar,meal_timing,notes,recorded_at,created_at", {
        method: "GET",
        headers: sbHeaders()
      })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (data) {

          setStatus("connected", "Live");

          if (readings.length > 0) { $("pdf-btn").style.display = "inline-flex"; } else { $("pdf-btn").style.display = "none"; }

    function toast(title, desc, type) {

      var bpLine = (r.systolic != null && r.diastolic != null) ? escapeHtml(r.systolic) + '/' + escapeHtml(r.diastolic) + ' mmHg' : '&nbsp;';
      var sugarLine = r.sugar != null ? 'Sugar: ' + escapeHtml(r.sugar) : '&nbsp;';

      html += '<div class="dr-row2">' + bpLine + '</div>';
      html += '<div class="dr-row3">' + sugarLine + '</div>';
      if (r.notes) { html += '<div class="dr-row4">' + escapeHtml(r.notes) + '</div>'; }
      html += '</div>';

        var notesCellHtml = r.notes ? '<span style="font-size:0.72rem;color:var(--fg);font-weight:700;">' + escapeHtml(r.notes) + '</span>' : '<span style="color:var(--muted-fg);font-size:0.75rem;">—</span>';

    function renderDaily(container) {
      var byDate = {};
      readings.forEach(function (r) {

    // ---- PDF download ----
    function handlePDF() {
      if (readings.length === 0) {
        toast("Nothing to export", "No readings to download.", "error");
        return;
      }
      if (typeof window.jspdf === "undefined" || !window.jspdf.jsPDF) {
        toast("PDF library loading", "Try again in a moment.", "error");
        return;
      }

      var jsPDF = window.jspdf.jsPDF;
      var isDaily = currentView === "daily";
      var doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
      var pageWidth = doc.internal.pageSize.getWidth();
      var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      var now = new Date();

      // Title
      doc.setFontSize(18);
      doc.setFont("helvetica", "bold");
      doc.setTextColor(0);
      doc.text("Naghmana Sattar's Health Log", 14, 18);

      // Subtitle
      doc.setFontSize(9);
      doc.setFont("helvetica", "normal");
      doc.setTextColor(120);
      var dateStr = now.getDate() + " " + months[now.getMonth()] + " " + now.getFullYear();
      var viewLabel = isDaily ? "  \u00b7  Daily view" : "  \u00b7  List view";
      doc.text("Printed on " + dateStr + "  \u00b7  " + readings.length + (readings.length === 1 ? " reading" : " readings") + viewLabel, 14, 24);

      if (isDaily) {
        // --- DAILY VIEW PDF ---
        var byDate = {};
        readings.forEach(function (r) {
          var d = new Date(r.recordedAt);
          var key = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
          if (!byDate[key]) byDate[key] = { date: d, slots: { Morning: [], Midday: [], Evening: [], Night: [] } };
          byDate[key].slots[timeSlot(d)].push(r);
        });
        var dates = Object.keys(byDate).sort(function (a, b) { return new Date(b) - new Date(a); });

        var body = dates.map(function (key) {
          var day = byDate[key];
          var row = [formatDate(day.date)];
          SLOTS.forEach(function (slot) {
            var rs = day.slots[slot].slice().sort(function (a, b) { return new Date(a.recordedAt) - new Date(b.recordedAt); });
            if (rs.length === 0) { row.push("\u2014"); return; }
            var lines = [];
            rs.forEach(function (r, idx) {
              var d = new Date(r.recordedAt);
              var meal = r.mealTiming ? " (" + (r.mealTiming === "before" ? "before meal" : "after meal") + ")" : "";
              lines.push(formatTime(d) + meal);
              if (r.systolic != null && r.diastolic != null) {
                lines.push("BP: " + r.systolic + "/" + r.diastolic + " mmHg");
              } else {
                lines.push("BP: \u2014");
              }
              if (r.sugar != null) {
                lines.push("Sugar: " + r.sugar);
              } else {
                lines.push("Sugar: \u2014");
              }
              if (r.notes) {
                lines.push("Notes: " + r.notes);
              }
              if (idx < rs.length - 1) { lines.push(""); }
            });
            row.push(lines.join("\n"));
          });
          return row;
        });

        doc.autoTable({
          startY: 30,
          head: [["Date", "Morning\n(5am-11am)", "Midday\n(11am-4pm)", "Evening\n(4pm-9pm)", "Night\n(9pm-5am)"]],
          body: body,
          theme: "grid",
          headStyles: { fillColor: [225, 29, 72], textColor: 255, fontStyle: "bold", fontSize: 9, halign: "center", valign: "middle", cellPadding: 3 },
          styles: { fontSize: 9, cellPadding: 3, textColor: [30, 30, 30], lineColor: [200, 200, 200], lineWidth: 0.2, valign: "top", overflow: "linebreak" },
          alternateRowStyles: { fillColor: [250, 250, 252] },
          columnStyles: {
            0: { cellWidth: 25, fontStyle: "bold" },
            1: { cellWidth: 41, fontStyle: "bold" },
            2: { cellWidth: 41, fontStyle: "bold" },
            3: { cellWidth: 41, fontStyle: "bold" },
            4: { cellWidth: 41, fontStyle: "bold" }
          },
          margin: { left: 10, right: 10, top: 30, bottom: 20 },
          didDrawPage: function (data) {
            var pageHeight = doc.internal.pageSize.getHeight();
            doc.setFontSize(7);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(160);
            doc.text("Page " + doc.internal.getNumberOfPages(), pageWidth - 20, pageHeight - 8);
            doc.text("Health Log", 10, pageHeight - 8);
          }
        });
      } else {
        // --- LIST VIEW PDF (with notes) ---
        var sorted = readings.slice().sort(function (a, b) { return new Date(b.recordedAt) - new Date(a.recordedAt); });
        var body = sorted.map(function (r) {
          var d = new Date(r.recordedAt);
          var when = formatDate(d) + ", " + formatTime(d);
          var bp = (r.systolic != null && r.diastolic != null) ? r.systolic + "/" + r.diastolic + " mmHg" : "\u2014";
          var sugar = r.sugar != null ? String(r.sugar) : "\u2014";
          var meal = r.mealTiming ? (r.mealTiming === "before" ? "Before meal" : "After meal") : "\u2014";
          var notes = r.notes ? r.notes : "\u2014";
          return [when, bp, sugar, meal, notes];
        });

        doc.autoTable({
          startY: 30,
          head: [["When", "BP", "Sugar", "Meal", "Notes"]],
          body: body,
          theme: "grid",
          headStyles: { fillColor: [225, 29, 72], textColor: 255, fontStyle: "bold", fontSize: 10, halign: "left", cellPadding: 3 },
          styles: { fontSize: 9, cellPadding: 3, textColor: [30, 30, 30], lineColor: [200, 200, 200], lineWidth: 0.2, valign: "top", overflow: "linebreak" },
          alternateRowStyles: { fillColor: [250, 250, 252] },
          columnStyles: { 0: { cellWidth: 42 }, 1: { cellWidth: 30, fontStyle: "bold" }, 2: { cellWidth: 22, fontStyle: "bold" }, 3: { cellWidth: 28 }, 4: { cellWidth: 48 } },
          margin: { left: 10, right: 10, top: 30, bottom: 20 },
          didDrawPage: function (data) {
            var pageHeight = doc.internal.pageSize.getHeight();
            doc.setFontSize(7); doc.setFont("helvetica", "normal"); doc.setTextColor(160);
            doc.text("Page " + doc.internal.getNumberOfPages(), pageWidth - 20, pageHeight - 8);
            doc.text("Health Log", 14, pageHeight - 8);
          }
        });
      }

      // --- Footnote ---
      var finalY = doc.lastAutoTable.finalY || 30;
      doc.setFontSize(8);
      doc.setFont("helvetica", "italic");
      doc.setTextColor(120);
      doc.text("BP = blood pressure (mmHg)  ·  Sugar = blood glucose  ·  pre = before meal  ·  post = after meal", 10, finalY + 7);

      var filename = "health-log-" + now.getFullYear() + "-" + pad2(now.getMonth() + 1) + "-" + pad2(now.getDate()) + ".pdf";
      doc.save(filename);
      toast("PDF downloaded \u2713", filename);
    }

    // ---- Install ----
    function setupInstall() {
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferredPrompt = e;
      });
      window.addEventListener("appinstalled", function () {
        deferredPrompt = null;
        $("install-btn").style.display = "none";
        toast("App installed", "Find it on your home screen.");
      });
      if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true) {
        $("install-btn").style.display = "none";
      }
    }
    function handleInstall() {
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS && !deferredPrompt) {
        toast("Install on iPhone/iPad", "In Safari: tap the Share icon, then 'Add to Home Screen'.", "error");
        return;
      }
      if (!deferredPrompt) {
        toast("Install the app", "Use your browser menu \u2192 'Add to Home screen' or 'Install app'.", "error");
        return;
      }
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function (choice) {
        if (choice.outcome === "accepted") { $("install-btn").style.display = "none"; }
        deferredPrompt = null;
      });
    }

    // ---- Auto-refresh (live updates every 30 seconds) ----
    function startAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(function () {
        if (configured) { fetchReadings(); }
      }, 30000);
    }
    // Also refresh when the page becomes visible again (e.g. switching tabs)
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && configured) { fetchReadings(); }
    });

    // ---- Init ----
    function init() {
      $("pdf-btn").addEventListener("click", handlePDF);
      $("install-btn").addEventListener("click", handleInstall);
      // View toggle
      $("view-toggle").addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-view]");
        if (!btn) return;
        currentView = btn.getAttribute("data-view");
        var btns = this.querySelectorAll("button[data-view]");
        for (var i = 0; i < btns.length; i++) { btns[i].classList.toggle("active", btns[i] === btn); }
        render();
      });
      setupInstall();
      fetchReadings();
      startAutoRefresh();
    }

    if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", init); }
    else { init(); }
  })();
  </script>
</body>
</html>
